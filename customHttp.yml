customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
  - pattern: 'assets/fonts/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: 'assets/css/*'
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: 'assets/js/*'
    headers:
      - key: Cache-Control
        value: no-cache
